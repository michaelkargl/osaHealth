# Receive logs forwarded by the Docker Fluentd logging driver
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Expose an HTTP health endpoint used by the Docker healthcheck
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>

# Attempt JSON parsing of the log field; DAPR uses --log-as-json and F# may
# emit structured JSON. Falls back to raw text for non-JSON lines.
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error false
  <parse>
    @type multi_format
    <pattern>
      format json
    </pattern>
    <pattern>
      format none
    </pattern>
  </parse>
</filter>

# Forward all docker-tagged logs to Loki
<match docker.**>
  @type loki
  url "http://loki:3100"

  extra_labels {"job":"docker"}

  <label>
    container_name $.container_name
  </label>

  line_format json

  <buffer>
    flush_mode interval
    flush_interval 1s
    flush_at_shutdown true
    retry_type exponential_backoff
    retry_max_times 10
    chunk_limit_size 256KB
    total_limit_size 512MB
  </buffer>
</match>
