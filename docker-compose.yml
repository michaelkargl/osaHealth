networks:
  osa_network:
    driver: bridge

volumes:
  mongodb_data:
  vault_data:
  loki_data:

# Reusable logging config for containers whose logs should be collected by Fluentd.
# fluentd-async keeps containers startable even if Fluentd is temporarily unavailable;
# the Docker daemon buffers logs until the connection is established.
x-fluentd-logging: &fluentd-logging
  driver: fluentd
  options:
    fluentd-address: "localhost:24224"
    fluentd-async: "true"
    tag: "docker.{{.Name}}"

services:
  mongodb:
    image: mongo:8-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - osa_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *fluentd-logging

  vault:
    image: hashicorp/vault:1.17
    user: "0"
    entrypoint: ["vault", "server", "-config=/vault/config/config.hcl"]
    volumes:
      - vault_data:/vault/data
      - ./infrastructure/vault/config:/vault/config:ro
    ports:
      - 8200:8200
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    networks:
      - osa_network
    healthcheck:
      test: ["CMD-SHELL", "vault status; rc=$$?; [ $$rc -eq 0 ] || [ $$rc -eq 2 ]"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *fluentd-logging

  vault-init:
    image: mcr.microsoft.com/dotnet/sdk:11.0.100-preview.4
    entrypoint: ["pwsh", "-File", "/vault/init/init.ps1", "-VaultBaseUri", "http://vault:8200", "-DaprSecretsPath", "/dapr/secrets.json", "-MongoUser", "${MONGO_ROOT_USER}", "-MongoPassword", "${MONGO_ROOT_PASSWORD}", "-UnsealKey", "${VAULT_UNSEAL_KEY:-}", "-RootToken", "${VAULT_ROOT_TOKEN:-}", "-PollIntervalSec", "2"]
    restart: "no"
    volumes:
      - ./infrastructure/vault/init:/vault/init:ro
      - ./infrastructure/dapr:/dapr
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - osa_network
    logging: *fluentd-logging

  # Required by the DAPR runtime even though osaHealth does not use the actor pattern.
  # The DAPR sidecar will not start without a reachable placement service.
  dapr-placement:
    image: daprio/placement:1.17.7-linux-amd64
    command: ["./placement", "--port", "50006"]
    networks:
      - osa_network
    logging: *fluentd-logging

  # F# Oxpecker service. The DAPR sidecar (api-dapr) shares this
  # container's network namespace, so the published 3500 below is the
  # sidecar's HTTP port. The app itself listens on 8080 (see Dockerfile),
  # which must match the sidecar's --app-port.
  api:
    build:
      context: ./src/osaHealth.Api
    ports:
      - 13500:3500
      # 8080 is the app's Kestrel port; published so the Swagger UI at
      # http://localhost:18080/swagger is reachable from the host.
      - 18080:8080
    networks:
      - osa_network
    depends_on:
      mongodb:
        condition: service_healthy
    logging: *fluentd-logging

  api-dapr:
    image: daprio/daprd:1.17.7-stablecomponents
    command: [
      "./daprd",
      "--app-id", "osa-api",
      "--app-port", "8080",
      "--dapr-http-port", "3500",
      "--placement-host-address", "dapr-placement:50006",
      "--components-path", "/components",
      "--log-as-json"
    ]
    volumes:
      - ./infrastructure/dapr/components:/components
      - ./infrastructure/dapr/secrets.json:/secrets/secrets.json:ro
    depends_on:
      api:
        condition: service_started
      dapr-placement:
        condition: service_started
      mongodb:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    network_mode: "service:api"
    logging: *fluentd-logging

  mongo-express:
    profiles: ["dev"]
    image: mongo-express:1
    restart: always
    ports:
      - 8081:8081
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGOEXPRESS_ROOT_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEXPRESS_ROOT_PASSWORD}
    networks:
      - osa_network
    logging: *fluentd-logging

  zipkin:
    image: openzipkin/zipkin:3.4
    ports:
      - "9411:9411"
    networks:
      - osa_network
    logging: *fluentd-logging

  loki:
    image: grafana/loki:3.4.1
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - osa_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fluentd:
    build:
      context: ./infrastructure/fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./infrastructure/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    networks:
      - osa_network
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:24220/api/plugins.json || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    networks:
      - osa_network
    depends_on:
      loki:
        condition: service_healthy
  
  hindsight:
    profiles: ["dev"]
    image: ghcr.io/vectorize-io/hindsight:0.8.1
    restart: always
    ports:
      - 8888:8888
      - 9999:9999
    volumes:
      - ${HINDSIGHT_API_DATA_VOLUME}:/home/hindsight/.pg0
    environment:
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL}
    networks:
      - osa_network

  serena:
    profiles: ["dev"]
    build:
      context: ./infrastructure/serena
      dockerfile: Dockerfile
    image: serena-fsharp:latest
    volumes:
      # Mount osaHealth workspace so Serena can activate it as a project
      - ./:/workspace/osaHealth
      # Persist Serena config and session logs across container restarts
      - ./infrastructure/serena/config:/workspaces/serena/config
    ports:
      - "${SERENA_PORT:-9121}:9121"
      - "${SERENA_DASHBOARD_PORT:-24282}:24282"
    environment:
      - SERENA_DOCKER=1
    command:
      - serena
      - start-mcp-server
      - --transport
      - sse
      - --port
      - "9121"
      - --host
      - 0.0.0.0
      - --context
      - claude-code