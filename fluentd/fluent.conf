# All containers use Docker's Fluentd logging driver as the single log pipeline.
# DAPR outputs structured JSON to stdout (--log-as-json flag), which Docker
# captures and forwards here — no DAPR logging component is configured, so
# each log line arrives exactly once.
# Receive logs forwarded by the Docker Fluentd logging driver
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Expose an HTTP health endpoint used by the Docker healthcheck
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>

# Attempt JSON parsing of the log field; DAPR uses --log-as-json and F# may
# emit structured JSON. Falls back to raw text for non-JSON lines.
<filter docker.**>
  @type parser
  # parse the log property
  key_name log
  # prefix every log property with log.
  inject_key_prefix log.
  # retain the original unparsed log message
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# Forward all docker-tagged logs to Loki
<match docker.**>
  @type loki
  url "http://loki:3100"

  extra_labels {"job":"docker"}

  <label>
    container_name $.container_name
  </label>

  line_format json

  <buffer>
    flush_mode interval
    flush_interval 1s
    flush_at_shutdown true
    retry_type exponential_backoff
    retry_max_times 10
    chunk_limit_size 256KB
    total_limit_size 512MB
  </buffer>
</match>
